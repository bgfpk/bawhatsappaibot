# Temporary hostname for the existing Black Arrow production release only.
# Conversion staging and its credentials are never an upstream of this host.
map $http_origin $blackarrow_public_origin {
  default $http_origin;
  "https://app.blackgoldfertilizer.com" "https://blackarrow.traino.live";
}
server {
  listen 80;
  listen [::]:80;
  server_name app.blackgoldfertilizer.com;
  location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
  location / { return 301 https://app.blackgoldfertilizer.com$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app.blackgoldfertilizer.com;
  ssl_certificate /etc/letsencrypt/live/app.blackgoldfertilizer.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.blackgoldfertilizer.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 3m;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Black-Arrow-Release "existing-production" always;
  location ^~ /api/health/ { return 404; }
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Register this exact HTTPS alias without weakening the application's
    # session/CSRF checks. Missing or other origins are forwarded unchanged.
    proxy_set_header Origin $blackarrow_public_origin;
    proxy_read_timeout 30s;
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
