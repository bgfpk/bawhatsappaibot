upstream blackarrow_public_web {
    server 127.0.0.1:3102;
    keepalive 32;
}

upstream blackarrow_existing_app_live {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl;
    server_name blackarrow-source.offline.invalid;

    ssl_certificate /etc/letsencrypt/live/blackarrow-source.offline.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blackarrow-source.offline.invalid/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://blackarrow-source.offline.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name blackarrow-source.offline.invalid;

    ssl_certificate /etc/letsencrypt/live/blackarrow-source.offline.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blackarrow-source.offline.invalid/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /api/ {
        proxy_pass http://blackarrow_existing_app_live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /socket.io/ {
        proxy_pass http://blackarrow_existing_app_live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ^~ /assets/ {
        proxy_pass http://blackarrow_existing_app_live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_next/static/ {
        proxy_pass http://blackarrow_public_web;
        proxy_http_version 1.1;
        proxy_set_header Host blackarrow-source.offline.invalid;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /_next/ {
        proxy_pass http://blackarrow_public_web;
        proxy_http_version 1.1;
        proxy_set_header Host blackarrow-source.offline.invalid;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /brand/ {
        proxy_pass http://blackarrow_public_web;
        proxy_http_version 1.1;
        proxy_set_header Host blackarrow-source.offline.invalid;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location = /health {
        proxy_pass http://blackarrow_public_web;
        proxy_http_version 1.1;
        proxy_set_header Host blackarrow-source.offline.invalid;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /indexnow-verification-placeholder.txt {
        proxy_pass http://blackarrow_public_web;
        proxy_http_version 1.1;
        proxy_set_header Host blackarrow-source.offline.invalid;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        proxy_pass http://blackarrow_public_web;
        proxy_http_version 1.1;
        proxy_set_header Host blackarrow-source.offline.invalid;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(?:features|pricing|integrations|about|contact|docs|documentation|homepage-prototype|blog|privacy|terms|disclaimer|robots\.txt|sitemap\.xml)/?$ {
        proxy_pass http://blackarrow_public_web;
        proxy_http_version 1.1;
        proxy_set_header Host blackarrow-source.offline.invalid;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(?:blog|docs)/[^/]+/?$ {
        proxy_pass http://blackarrow_public_web;
        proxy_http_version 1.1;
        proxy_set_header Host blackarrow-source.offline.invalid;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(?:whatsapp-automation|ai-whatsapp-bot|ai-whatsapp-bot-259|whatsapp-customer-support|ecommerce-whatsapp-bot|whatsapp-order-capture|whatsapp-automation-for-small-business|whatsapp-ai-bot-for-ecommerce|whatsapp-bot-pricing|best-whatsapp-automation-tool|blackarrow-vs-manual-whatsapp-support|whatsapp-automation-pakistan|whatsapp-cod-order-automation|whatsapp-order-tracking-automation|whatsapp-human-handoff|whatsapp-voice-note-automation|woocommerce-whatsapp-automation|postex-whatsapp-integration|leopards-whatsapp-integration|blackarrow-vs-wati|blackarrow-vs-aisensy|blackarrow-vs-interakt|whatsapp-api-vs-linked-devices)/?$ {
        proxy_pass http://blackarrow_public_web;
        proxy_http_version 1.1;
        proxy_set_header Host blackarrow-source.offline.invalid;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(?:login|signup)/?$ {
        proxy_pass http://blackarrow_existing_app_live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://blackarrow_existing_app_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 80;
    server_name blackarrow-source.offline.invalid blackarrow-source.offline.invalid;
    return 301 https://blackarrow-source.offline.invalid$request_uri;
}
